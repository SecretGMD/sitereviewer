<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebReview Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --success-hover: #059669;
      --star: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }

    /* Auth Screens */
    .auth-container { max-width: 400px; margin: 5rem auto; padding: 2rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .auth-container h2 { margin-bottom: 1.5rem; text-align: center; }
    .auth-toggle { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    .auth-toggle span { color: var(--primary); cursor: pointer; text-decoration: underline; }

    /* Main Dashboard Layout */
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--card-bg); border-right: 1px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; flex-shrink: 0; }
    .sidebar h2 { font-size: 1.25rem; margin-bottom: 1.5rem; padding: 0 0.5rem; color: var(--primary); }
    .nav-btn { display: flex; align-items: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border: none; background: transparent; border-radius: 8px; color: var(--text-muted); font-size: 0.95rem; font-weight: 500; cursor: pointer; text-align: left; }
    .nav-btn:hover, .nav-btn.active { background: #e0e7ff; color: var(--primary); }
    .nav-btn.danger { color: var(--danger); margin-top: auto; }
    .nav-btn.danger:hover { background: #fee2e2; }

    .main-content { flex-grow: 1; padding: 2rem; overflow-y: auto; max-width: 1000px; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Card Components */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h3 { margin-bottom: 1rem; font-size: 1.1rem; }

    /* Form Elements */
    label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    input, textarea, select { width: 100%; padding: 0.65rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 1rem; font-size: 0.95rem; }
    input[type="checkbox"] { width: auto; margin-right: 0.5rem; }
    input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
    
    button.btn-primary { background: var(--primary); color: white; border: none; padding: 0.65rem 1.25rem; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-secondary { background: #e5e7eb; color: var(--text); border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.btn-secondary:hover { background: #d1d5db; }
    button.btn-success { background: var(--success); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    button.btn-success:hover { background: var(--success-hover); }
    button.btn-danger { background: var(--danger); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    button.btn-danger:hover { background: var(--danger-hover); }

    /* Lists & Grids */
    .site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .site-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    .site-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .site-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--text-muted); background-size: cover; background-position: center; flex-shrink: 0; }

    /* Review Displays */
    .stars { color: var(--star); font-size: 1.2rem; }
    .review-item { border-bottom: 1px solid var(--border); padding: 0.75rem 0; display: flex; justify-content: space-between; align-items: flex-start; }
    .review-item:last-child { border-bottom: none; }
    
    /* Badges / Tags */
    .tag-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600; margin-left: 0.35rem; display: inline-block; }
    .tag-admin { background: #fef3c7; color: #92400e; }
    .tag-staff { background: #dbeafe; color: #1e40af; }
    .tag-pending { background: #fed7aa; color: #9a3412; }
    .tag-approved { background: #d1fae5; color: #065f46; }

    .user-link { color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: underline; }
    .user-link:hover { color: var(--primary-hover); }

    .error-msg { color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    /* Collapsible Details */
    details { border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; background: var(--card-bg); margin-bottom: 1rem; }
    details summary { font-weight: 600; cursor: pointer; color: var(--primary); outline: none; }
    details[open] summary { margin-bottom: 1rem; }

    /* Modal / Overlay */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--card-bg); width: 90%; max-width: 500px; border-radius: 12px; padding: 1.5rem; position: relative; max-height: 85vh; overflow-y: auto; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted); }

    /* Audit Log Table */
    .log-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .log-table th, .log-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    .log-table th { background: #f9fafb; }
  </style>
</head>
<body>

  <div id="authView" class="auth-container">
    <h2 id="authTitle">Sign In</h2>
    <div id="authError" class="error-msg"></div>
    <form id="authForm">
      <label>Email
        <input type="email" id="authEmail" required>
      </label>
      <label id="usernameLabel" style="display: none;">Username
        <input type="text" id="authUsername">
      </label>
      <label>Password
        <input type="password" id="authPassword" required>
      </label>
      <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
    </form>
    <div class="auth-toggle">
      <span id="toggleAuthBtn">Need an account? Register</span>
    </div>
  </div>

  <div id="appLayout" class="app-layout" style="display: none;">
    <aside class="sidebar">
      <h2>WebReview</h2>
      <button class="nav-btn active" onclick="switchView('homeView')">🏠 Home</button>
      <button class="nav-btn" onclick="switchView('rankingsView')">📊 Site Rankings</button>
      <button class="nav-btn" id="staffNavBtn" style="display: none;" onclick="switchView('staffQueueView')">📋 Site Queue</button>
      <button class="nav-btn" onclick="switchView('settingsView')">⚙️ Settings</button>
      <button class="nav-btn" id="adminNavBtn" style="display: none;" onclick="switchView('adminView')">🛡️ Admin Panel</button>
      <button class="nav-btn danger" onclick="signOut()">🚪 Sign Out</button>
    </aside>

    <main class="main-content">

      <section id="homeView" class="view-section active">
        <h2 style="margin-bottom: 1.5rem;">Dashboard</h2>

        <div class="card">
          <div class="flex-between" style="margin-bottom: 1rem;">
            <h3>Top Websites</h3>
            <button class="btn-primary" style="width: auto; padding: 0.4rem 0.8rem;" onclick="switchView('rankingsView')">View Directory</button>
          </div>
          <div id="homeAllSitesGrid" class="site-grid"></div>
        </div>

        <div class="card">
          <h3>Your Websites</h3>
          <div id="mySitesContainer"></div>
        </div>
      </section>

      <section id="rankingsView" class="view-section">
        <h2 style="margin-bottom: 1rem;">Approved Website Directory</h2>
        <input type="text" id="siteSearchInput" placeholder="🔍 Search websites by title or owner..." oninput="renderRankings()">
        
        <div class="card" style="margin-top: 1rem;">
          <div class="flex-between" style="margin-bottom: 1rem;">
            <h3>Register Website for Review</h3>
          </div>
          <div id="siteCreationNotice" style="color:var(--danger); font-size:0.85rem; margin-bottom:0.5rem; display:none;"></div>
          <form id="createSiteForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
